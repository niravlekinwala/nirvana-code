[package]
name = "nirvana-code"
version = "0.3.0"
edition = "2024"
authors = ["Nirav Lekinwala"]
description = "Nirvana Code: Ultra-low latency Apple Silicon coding assistant and prompt engineering engine with Metal 3 acceleration, quantized KV caching, prefix caching, and speculative decoding."

[dependencies]
llama-cpp-2 = { version = "0.1.156", features = ["metal"] }
llama-cpp-sys-2 = "0.1.156"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.43", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
arboard = "3.4"
dirs = "6.0"
tui-textarea = "0.7"
encoding_rs = "0.8"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.8"
tower-http = { version = "0.7.1", features = ["cors"] }
async-stream = "0.3"
base64 = "0.23"
libc = "0.2"
sha2 = "0.10"
toml = "0.8"
minijinja = { version = "2", features = ["json", "loop_controls", "builtins"] }
minijinja-contrib = { version = "2", features = ["pycompat", "datetime"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
