# Keeps llama-cpp-2 (and everything else) current. Most Metal kernel
# improvements arrive through llama-cpp-2 bumps — review those PRs with
# `nirvana-code bench --json` before and after.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      llama-cpp:
        patterns: ["llama-cpp-*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
