# `target-cpu=native` gives the best local build (and makes llama-cpp-sys-2
# enable GGML_NATIVE). It is NOT safe for distributed binaries: a binary built
# on an M4 (SME) will crash on an M1. Release/CI artifacts are built with
# RUSTFLAGS="" (rustc's default CPU for this target is already apple-m1) —
# see scripts/build-release.sh. Do not pass -C target-cpu=apple-m1: the sys
# crate forwards it to clang as -march=apple-m1, which clang rejects.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
